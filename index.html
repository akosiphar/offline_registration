<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Youth Anniversary Registration</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <!-- iOS/iPadOS PWA helpers -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      :root {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
          Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        /* color-scheme: light dark; */
        background: url("./BACKGROUND.png") no-repeat;
        background-size: 200%;
      }
      html,
      body {
        /* height: 100%; */
        position: relative;
      }
      .container {
        max-width: 820px;
        margin: 0 auto;
        padding: 24px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
      }
      @supports (height: 100svh) {
        body {
          min-height: 100svh;
        }
      }
      * {
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      h1 {
        color: white;
        text-align: center;
      }
      .card {
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.04);
      }
      .row {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
        color: white;
      }
      label {
        font-weight: 600;
      }
      select,
      input,
      textarea,
      button {
        font: inherit;
        font-size: 18px;
        padding: 14px 14px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 12px;
        min-height: 48px;
        touch-action: manipulation;
      }
      textarea {
        min-height: 120px;
      }
      button {
        cursor: pointer;
        min-width: 48px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 14px;
        color: black;
      }
      .status.online {
        background: #dcfce7;
      }
      .status.offline {
        background: #fee2e2;
      }
      .muted {
        color: #838996;
        font-size: 15px;
      }
      .confirmation {
        color: #00ff37;
        font-size: 15px;
      }
      .toast {
        margin-top: 10px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .bg-container {
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center">
      <img src="./theme.png" alt="" style="width: 30em" />
    </div>
    <h1>Youth Anniversary Registration</h1>
    <!-- <p class="muted">
      Tablet‑optimized. Works offline. Queues submissions locally and syncs when
      back online.
    </p> -->

    <div class="container" style="z-index: 10">
      <div class="card" style="margin-top: 16px">
        <form id="form">
          <div class="row">
            <label for="name">Name</label>
            <input
              id="name"
              name="name"
              placeholder="First Name Last Name"
              required
              autocomplete="Name"
            />
          </div>
          <div class="row">
            <label for="name">FB Name</label>
            <input
              id="fbName"
              name="fb name"
              placeholder="Your name in Facebook"
              required
              autocomplete="FB Name"
            />
          </div>
          <div class="row">
            <label for="name">Age</label>
            <input id="age" name="age" required autocomplete="Age" />
          </div>
          <div class="row">
            <label for="school/work">School/Work</label>
            <input
              id="schoolWork"
              name="School/Work"
              required
              autocomplete="School"
            />
          </div>
          <div class="row">
            <label for="birthday">Birthday</label>
            <input
              id="birthday"
              name="birthday"
              placeholder="MM DD, YYYY"
              required
              autocomplete="Birthday"
            />
          </div>
          <div class="row">
            <label for="firstTimer">First Timer?</label>
            <select id="firstTimer" autocomplete="First Timer">
              <option>Select one</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
          <div class="row" style="display: none;">
            <label for="invited">Invited By</label>
            <input
              id="invited"
              name="invited"
              placeholder="Who invites you"
              required
              autocomplete="invited by"
            />
          </div>
          <div class="row">
            <button id="sub" type="submit">Submit</button>
          </div>
          <div id="toast" class="toast confirmation"></div>
        </form>
      </div>

      <div class="card" style="margin-top: 12px">
        <strong>Sync now?</strong>
        <div id="net" class="status">Detecting…</div>
        <p class="muted">
          Submissions waiting to upload: <span id="qcount">0</span>
        </p>
        <div class="actions">
          <button id="syncBtn" type="button">Sync now</button>
          <!-- <button id="keepAwakeBtn" type="button">Keep screen awake</button>
        <button id="lockPortraitBtn" type="button">Lock to portrait</button> -->
        </div>
        <p class="muted" style="margin-top: 8px">
          <!-- Tip: Install to Home Screen for best kiosk‑like experience. On iPad:
        Share → Add to Home Screen. On Android: ⋮ menu → Install app.
      </p> -->
        </p>
      </div>
    </div>

    <!-- Backgrounds -->
    <div class="bg-container">
      <img
        src="./straightTL.png"
        style="position: absolute; z-index: -1; top: 0; left: 0; width: 30%"
      />
      <img
        src="./circleBL.png"
        style="position: absolute; z-index: -1; bottom: 0; left: 0; width: 30%"
      />
      <img
        src="./straightBR.png"
        style="position: absolute; z-index: -1; bottom: 0; right: 0; width: 30%"
      />
      <img
        src="./circleTR.png"
        style="position: absolute; z-index: -1; top: 0; right: 0; width: 30%"
      />
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
