<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Youth Anniversary Registration</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <!-- iOS/iPadOS PWA helpers -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div style="text-align: center">
      <img class="theme" src="./img/theme.png" alt="" />
    </div>
    <h1>Youth Anniversary Registration</h1>
    <!-- <p class="muted">
      Tablet‑optimized. Works offline. Queues submissions locally and syncs when
      back online.
    </p> -->

    <div class="container" id="mainContainer" style="z-index: 10">
      <div class="card" style="margin-top: 16px">
        <form id="form">
          <div class="row">
            <label for="name">Name</label>
            <input
              id="name"
              name="name"
              placeholder="First Name Last Name"
              required
              autocomplete="Name"
            />
          </div>
          <div class="row">
            <label for="name">Facebook Name</label>
            <input
              id="fbName"
              name="fb name"
              placeholder="Your name in Facebook"
              required
              autocomplete="FB Name"
            />
          </div>
          <div class="row">
            <label for="name">Age</label>
            <input id="age" name="age" required autocomplete="Age" />
          </div>
          <div class="row">
            <label for="school/work">School/Work</label>
            <input
              id="schoolWork"
              name="School/Work"
              required
              autocomplete="School"
            />
          </div>
          <div class="row">
            <label for="firstTimer">First Timer?</label>
            <select id="firstTimer" required autocomplete="First Timer">
              <option value="">Select one</option>
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>
          <div id="box" style="display: none">
            <div class="row">
              <label for="invited">Invited By</label>
              <input
                id="invited"
                name="invited"
                placeholder="Who invites you"
                autocomplete="invited by"
              />
            </div>
          </div>
          <div class="row">
            <button id="sub" type="submit">Submit</button>
          </div>
          <div id="toast" class="toast confirmation"></div>
        </form>
      </div>

      <div class="card" style="margin-top: 12px">
        <strong>Sync now?</strong>
        <div id="net" class="status">Detecting…</div>
        <p class="muted">
          Submissions waiting to upload: <span id="qcount">0</span>
        </p>
        <div class="actions">
          <button id="syncBtn" type="button">Sync now</button>
        </div>
      </div>
    </div>

    <!-- Thank you pop-up -->
    <div
      class="card"
      id="thankYouPage"
      style="display: none; text-align: center; padding: 20px; color: white"
    >
      <h2>🎉 Thank you!</h2>
      <p style="margin-bottom: 10px">
        Your form has been submitted successfully.
      </p>
      <button onclick="goBack()">Back to Form</button>
    </div>

    <!-- Backgrounds -->
    <div class="bg-container">
      <img
        class="design"
        src="./img/straightTL.png"
        style="position: absolute; z-index: -1; top: 0; left: 0"
      />
      <img
        class="design"
        src="./img/circleBL.png"
        style="position: absolute; z-index: -1; bottom: 0; left: 0"
      />
      <img
        class="design"
        src="./img/straightBR.png"
        style="position: absolute; z-index: -1; bottom: 0; right: 0"
      />
      <img
        class="design"
        src="./img/circleTR.png"
        style="position: absolute; z-index: -1; top: 0; right: 0"
      />
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
